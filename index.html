    <button type="button" data-lang="ko" class="active">KR</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div class="container">
      <header>
        <h1 class="title" data-i18n="title">드럼비트 연습기 🥁</h1>
        <div class="date-info">
          <span id="date-display">--</span>
        </div>
      </header>

      <main>
        <!-- 모드 선택 -->
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="beat" data-i18n="modeBeat">기본 비트</button>
          <button class="mode-btn" data-mode="rudiment" data-i18n="modeRudiment">루딤먼트</button>
          <button class="mode-btn" data-mode="tempo" data-i18n="modeTempo">템포 트레이너</button>
        </div>

        <!-- 기본 비트 모드 -->
        <div id="beat-mode" class="mode-content active">
          <!-- 난이도 선택 -->
          <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="beginner">
              Beginner
            </button>
            <button class="difficulty-btn" data-difficulty="intermediate">
              Intermediate
            </button>
            <button class="difficulty-btn" data-difficulty="advanced">
              Advanced
            </button>
          </div>

          <!-- 박자 선택 -->
          <div class="time-signature-selector">
            <label data-i18n="labelTimeSignature">박자:</label>
            <select id="time-signature">
              <option value="4/4">4/4</option>
              <option value="3/4">3/4</option>
              <option value="6/8">6/8</option>
            </select>
          </div>

          <!-- BPM 컨트롤 -->
          <div class="bpm-control">
            <label for="bpm-slider">BPM: <span id="bpm-value">120</span></label>
            <input
              type="range"
              id="bpm-slider"
              min="40"
              max="220"
              value="120"
            />
          </div>

          <!-- 비트 시각화 -->
          <div class="beat-visualization">
            <div class="beat-track">
              <div class="track-label" data-i18n="trackHihat">하이햇</div>
              <div class="beat-grid" id="hihat-grid"></div>
            </div>
            <div class="beat-track">
              <div class="track-label" data-i18n="trackSnare">스네어</div>
              <div class="beat-grid" id="snare-grid"></div>
            </div>
            <div class="beat-track">
              <div class="track-label" data-i18n="trackKick">킥</div>
              <div class="beat-grid" id="kick-grid"></div>
            </div>
            <div class="beat-track">
              <div class="track-label" data-i18n="trackBass">베이스</div>
              <div class="beat-grid" id="bass-grid"></div>
            </div>
            <div class="beat-track">
              <div class="track-label" data-i18n="trackGuitar">기타</div>
              <div class="beat-grid" id="guitar-grid"></div>
            </div>
            <div class="playhead" id="playhead"></div>
          </div>

          <!-- 컨트롤 버튼 -->
          <div class="controls">
            <button id="play-pause-btn" class="control-btn play-btn" data-i18n="btnPlay">
              ▶ 재생
            </button>
            <button id="mute-btn" class="control-btn" data-i18n="btnMute">🔇 뮤트 모드</button>
            <button id="reset-btn" class="control-btn" data-i18n="btnReset">🔄 리셋</button>
          </div>

          <!-- 오늘의 비트 정보 -->
          <div class="today-beat-info">
            <div class="beat-description" id="beat-description" data-i18n="loadingBeat">
              오늘의 드럼 비트를 불러오는 중...
            </div>
            <div class="beat-controls">
              <button id="random-beat-btn" class="random-btn" data-i18n="btnRandomBeat">
                🎲 랜덤 비트
              </button>
              <button id="random-melody-btn" class="random-btn" data-i18n="btnRandomMelody">
                🎵 랜덤 멜로디
              </button>
              <button id="share-beat-btn" class="share-btn" data-i18n="btnShare">공유하기 📤</button>
            </div>
          </div>

        </div>

        <!-- 루딤먼트 모드 -->
        <div id="rudiment-mode" class="mode-content">
          <div class="rudiment-selector">
            <label data-i18n="labelRudimentPattern">루딤먼트 패턴:</label>
            <select id="rudiment-pattern">
              <option value="single" data-i18n-option="rudimentSingle">Single Stroke (R L R L)</option>
              <option value="double" data-i18n-option="rudimentDouble">Double Stroke (R R L L)</option>
              <option value="paradiddle" data-i18n-option="rudimentParadiddle">Paradiddle (R L R R / L R L L)</option>
              <option value="flam" data-i18n-option="rudimentFlam">Flam (R L R L)</option>
            </select>
          </div>
          <div class="bpm-control">
            <label for="rudiment-bpm"
              >BPM: <span id="rudiment-bpm-value">120</span></label
            >
            <input
              type="range"
              id="rudiment-bpm"
              min="40"
              max="220"
              value="120"
            />
          </div>
          <div class="rudiment-display">
            <div class="hand-indicator" id="hand-indicator">
              <div class="hand left" id="left-hand">L</div>
              <div class="hand right" id="right-hand">R</div>
            </div>
            <div class="rudiment-pattern-text" id="rudiment-pattern-text">
              R L R R
            </div>
          </div>
          <div class="controls">
            <button id="rudiment-play-btn" class="control-btn play-btn" data-i18n="btnPlay">
              ▶ 재생
            </button>
            <button id="rudiment-reset-btn" class="control-btn" data-i18n="btnReset">🔄 리셋</button>
          </div>
        </div>

        <!-- 템포 트레이너 모드 -->
        <div id="tempo-mode" class="mode-content">
          <div class="tempo-trainer-controls">
            <div class="tempo-input">
              <label data-i18n="labelStartBpm">시작 BPM:</label>
              <input
                type="number"
                id="start-bpm"
                min="40"
                max="200"
                value="80"
              />
            </div>
            <div class="tempo-input">
              <label data-i18n="labelTargetBpm">목표 BPM:</label>
              <input
                type="number"
                id="target-bpm"
                min="40"
                max="220"
                value="120"
              />
            </div>
            <div class="tempo-input">
              <label data-i18n="labelPracticeTime">연습 시간 (분):</label>
              <input
                type="number"
                id="practice-time"
                min="1"
                max="30"
                value="5"
              />
            </div>
            <div class="tempo-input">
              <label data-i18n="labelBpmIncrement">BPM 증가량:</label>
              <input
                type="number"
                id="bpm-increment"
                min="1"
                max="10"
                value="2"
                step="0.5"
              />
            </div>
          </div>
          <div class="tempo-display">
            <div class="current-bpm-display" id="current-bpm-display">80</div>
            <div class="tempo-progress">
              <div class="progress-bar" id="tempo-progress-bar"></div>
            </div>
            <div class="time-remaining" id="time-remaining">5:00</div>
          </div>
          <div class="controls">
            <button id="tempo-start-btn" class="control-btn play-btn" data-i18n="btnStart">
              ▶ 시작
            </button>
            <button id="tempo-stop-btn" class="control-btn" data-i18n="btnStop">⏹ 정지</button>
            <button id="tempo-reset-btn" class="control-btn" data-i18n="btnReset">🔄 리셋</button>
          </div>
        </div>
      </main>

      <section class="more-tests-section">
        <div class="more-tests-card">
          <div class="more-tests-text">
            <p class="more-tests-eyebrow" data-i18n="moreTestsEyebrow">여기서 멈추기 아쉽죠</p>
            <p class="more-tests-title" data-i18n="moreTestsTitle">다른 재밌는 것들도 있어요</p>

          </div>
          <button id="more-tests-btn" class="more-tests-btn" type="button" data-i18n="btnMoreTests">

          </button>
        </div>
      </section>

      <footer>
        <p>
          © 2025
          <a href="mailto:ashlight2510@gmail.com" class="footer-link"
            >AshLight</a
          >. All rights reserved.
        </p>
      </footer>
    </div>

      };

      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function t(key, vars = {}) {
        const langTable = translations[currentLang] || translations.ko;
        let template = langTable?.[key] ?? translations.ko?.[key] ?? key;
        if (typeof template !== "string") return template;
        Object.keys(vars).forEach((k) => {
          template = template.replace(new RegExp(`\\{${k}\\}`, "g"), vars[k]);
        });
        return template;
      }

      function applyTranslations() {
        document.title = t("metaTitle");
        const descMeta = document.querySelector('meta[name="description"]');
        if (descMeta) descMeta.setAttribute("content", t("metaDescription"));
        const ogTitleMeta = document.querySelector('meta[property="og:title"]');
        if (ogTitleMeta) ogTitleMeta.setAttribute("content", t("metaTitle"));
        const ogDescMeta = document.querySelector('meta[property="og:description"]');
        if (ogDescMeta) ogDescMeta.setAttribute("content", t("metaDescription"));
        const twitterTitleMeta = document.querySelector('meta[name="twitter:title"]');
        if (twitterTitleMeta) twitterTitleMeta.setAttribute("content", t("metaTitle"));
        const twitterDescMeta = document.querySelector('meta[name="twitter:description"]');
        if (twitterDescMeta) twitterDescMeta.setAttribute("content", t("metaDescription"));
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.dataset.i18nHtml);
        });
        // Select options
        document.querySelectorAll("select option[data-i18n-option]").forEach((el) => {
          el.textContent = t(el.dataset.i18nOption);
        });
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      function setLang(lang, options = {}) {
        const nextLang = supportedLangs.includes(lang) ? lang : defaultLang;
        currentLang = nextLang;
        window.currentLang = currentLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
        // Update dynamic content if needed
        if (window.updateDateDisplay) window.updateDateDisplay();
        if (window.updateBeatDescription) window.updateBeatDescription();
      }

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });

      setLang(detectLang(), { updateUrl: false });

      // Make t() function and currentLang globally available
      window.t = t;
      window.currentLang = currentLang;
      window.setLang = setLang;
    </script>
